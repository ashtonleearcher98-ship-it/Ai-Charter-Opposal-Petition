name: Clear superseded Pages deployment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clear-stuck-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale deployment lock from the earlier superseded commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          STALE_SHA=e676a4990300b213d63eb6fd4cfc781362cc36b7
          echo 'Attempting to clear old superseded Pages deployment.'
          curl --fail-with-body --show-error --silent --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPOSITORY/pages/deployments/$STALE_SHA/cancel"
          echo 'Cancellation request accepted.'
