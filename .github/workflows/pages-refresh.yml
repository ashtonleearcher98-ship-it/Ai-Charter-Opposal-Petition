name: Refresh blocked GitHub Pages build
on:
  push:
    paths:
      - '.github/workflows/pages-refresh.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub Pages publishing status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS --fail-with-body -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/${{ github.repository }}/pages" |             python3 -c 'import json,sys;j=json.load(sys.stdin);print("Pages status:",j.get("status"),"Build:",j.get("build_type"),"Source:",j.get("source"),"URL:",j.get("html_url"))'
      - name: Request a fresh GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --show-error --silent --request POST             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             -H "Authorization: Bearer $GH_TOKEN"             -H "Content-Type: application/json"             "https://api.github.com/repos/${{ github.repository }}/pages/builds"
          echo "Fresh Pages build requested."
